submission:
  title: "LIFECLOCK — cold-chain control tower, operated by IBM Bob"

  problem_statement: >
    Supply chain operations teams managing cold-chain pharmaceutical shipments
    (vaccines, biologics) face a dual crisis: disruptions such as port strikes,
    blizzards, and hurricanes cascade across hundreds of active shipments in ways
    that are impossible to track manually, while IoT temperature sensors generate
    thousands of readings per day that go unanalysed until a $500K+ cargo arrives
    spoiled at its destination. The combination means operations managers are always
    reacting too late — after the damage is done.

  solution_summary: >
    LIFECLOCK is a cold-chain control tower built on one idea: a shipment has two
    deadlines. The schedule clock is hours until it is late; the stability clock is
    hours until the cargo is no longer usable. Whichever is smaller is its life
    clock, and every engine reads it. That split produces decisions a cost-and-time
    router cannot reach — holding a vessel on ship power freezes the stability clock
    while the schedule clock runs, so waiting can beat rerouting; and a cheaper,
    faster route is rejected as infeasible when it outlasts the cargo, shown with
    the shortfall rather than quietly dropped. Severity, disposition and the clock
    are decided by rule engines with versioned regulatory profiles, never by the
    model; watsonx explains the conclusion afterwards and the product is unchanged
    without it. IBM Bob operates the tower through 12 MCP tools and is refused when
    it tries to commit a decision, with the refusal written into a hash-chained
    audit trail an operator can verify on screen.

  key_features:
    - "Life clock: two clocks per shipment (schedule vs stability) with the binding one marked; every engine reads it"
    - "Breach prediction from a Newton cooling fit — warns while the cargo is still in range, not after"
    - "Regulatory severity decided by a magnitude x duration matrix with freeze override, MKT and versioned rule profiles — never by the LLM"
    - "Real route search (Dijkstra + Yen k-shortest) over 40 nodes and 18 lanes, with landed cost and CO2; options that outlast the cargo are returned infeasible with the shortfall"
    - "IBM Bob operates it through 12 MCP tools and is refused when it tries to commit, with the refusal in a verifiable hash-chained audit trail"

  tech_stack:
    languages: ["JavaScript", "TypeScript"]
    frameworks: ["Next.js 16", "React 19", "Express 5", "Socket.IO", "Mongoose", "Tailwind CSS 4", "Recharts", "React Leaflet"]
    ibm_technologies: ["watsonx.ai (meta-llama/llama-4-maverick-17b-128e-instruct-fp8)", "IBM watsonx AI Node.js SDK (@ibm-cloud/watsonx-ai)", "IBM Bob"]
    databases: ["MongoDB 7 (via Mongoose ODM)"]
    other: ["Node.js 20", "Socket.IO WebSockets", "Leaflet geospatial maps", "MCP (Model Context Protocol)"]

  what_we_are_most_proud_of: >
    The architecture principle we are most proud of is the clean separation between
    deterministic computation and generative AI. Every numerical fact shown to the
    operator — risk scores, excursion severity, route costs, fleet match scores —
    is produced by a deterministic, testable engine. watsonx.ai is used exclusively
    as an explainer and orchestrator: it interprets structured tool outputs, generates
    human-readable rationale, and classifies cold-chain severity using GDP guidelines.
    This means the system is correct-by-design, not hallucination-dependent, which is
    exactly the production-grade pattern the architecture spec calls "the differentiator."

  known_limitations: >
    Authentication is mocked (single hardcoded Operations Manager role). MongoDB runs
    locally — no cloud deployment for this submission. The route graph is a demo
    network (5 US hubs); real deployments would integrate a live routing engine.
    The IoT sensor stream is simulated at 5-second intervals; production would use
    an MQTT gateway. Demo video shows local execution only — live demo URL is NOT DEPLOYED.

